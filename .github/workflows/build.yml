name: build

on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/MdReader/MdReader.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Portable (framework-dependent, single file)
        run: dotnet publish src/MdReader/MdReader.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:Version=${{ env.APP_VERSION }} -o publish/portable

      - name: Install Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version $env:APP_VERSION

      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path publish/portable/* -DestinationPath "dist/MdReader-portable-$env:APP_VERSION.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MdReader-${{ env.APP_VERSION }}
          path: dist/*

      # release 브랜치에 올리면 csproj 의 버전으로 태그를 만들고 Releases 페이지에 설치 파일을 올린다
      - name: Release
        if: github.ref == 'refs/heads/release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: MdReader ${{ env.APP_VERSION }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
