name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Portable (framework-dependent, single file)
        run: dotnet publish src/MdReader/MdReader.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/portable

      - name: Install Inno Setup
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version 0.4.0

      - uses: actions/upload-artifact@v4
        with:
          name: MdReader-portable-win-x64
          path: publish/portable
      - uses: actions/upload-artifact@v4
        with:
          name: MdReader-Setup
          path: dist/*.exe
