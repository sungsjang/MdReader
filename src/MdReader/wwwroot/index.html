<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src *; frame-src *; font-src 'self' data:; connect-src 'self'">
  <title>MdReader</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/app.css">
  <style id="vault-css"></style>
</head>
<body class="theme-light">
  <header id="toolbar">
    <div class="tb-group">
      <button class="tb-btn" data-cmd="sidebar" id="btn-sidebar" title="사이드바 (Ctrl+\)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <button class="tb-btn" data-cmd="open" title="열기 (Ctrl+O)">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7v10a2 2 0 0 0 2 2h12.5a2 2 0 0 0 1.9-1.4L21.7 12a1 1 0 0 0-1-1.3H7.4a2 2 0 0 0-1.9 1.4L3 19"/></svg>
      </button>
      <button class="tb-btn" data-cmd="back" id="btn-back" title="뒤로 (Alt+←)" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="tb-btn" data-cmd="forward" id="btn-forward" title="앞으로 (Alt+→)" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div id="doc-title" class="tb-title">
      <span id="vault-name" class="tb-vault"></span>
      <span id="file-name">MdReader</span>
    </div>

    <div class="tb-group">
      <button class="tb-btn" data-cmd="find" title="문서에서 찾기 (Ctrl+F)">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="tb-btn" data-cmd="zoomOut" title="축소 (Ctrl+-)">
        <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
      </button>
      <button class="tb-zoom" data-cmd="zoomReset" id="zoom-label" title="100%로 (Ctrl+0)">100%</button>
      <button class="tb-btn" data-cmd="zoomIn" title="확대 (Ctrl+=)">
        <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
      </button>
      <button class="tb-btn" data-cmd="theme" id="btn-theme" title="테마 전환 (Ctrl+D)">
        <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <div class="tb-menu-wrap">
        <button class="tb-btn" data-cmd="menu" title="더 보기">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
        </button>
        <div id="menu" class="menu" hidden>
          <button data-cmd="switcher">빠른 이동 <kbd>Ctrl+P</kbd></button>
          <button data-cmd="newTab">새 탭 <kbd>Ctrl+T</kbd></button>
          <button data-cmd="reopenTab">닫은 탭 다시 열기 <kbd>Ctrl+Shift+T</kbd></button>
          <hr>
          <button data-cmd="reload">새로고침 <kbd>F5</kbd></button>
          <button data-cmd="print">인쇄 / PDF로 저장 <kbd>Ctrl+Shift+P</kbd></button>
          <hr>
          <button data-cmd="showInFolder">탐색기에서 보기</button>
          <button data-cmd="openInObsidian" id="menu-obsidian">Obsidian에서 열기</button>
          <hr>
          <button data-cmd="togglePreview" class="menu-check" id="menu-preview">링크에 마우스를 올리면 미리보기</button>
          <button data-cmd="toggleSnippets" class="menu-check" id="menu-snippets">Obsidian CSS 스니펫 적용</button>
          <button data-cmd="toggleRestore" class="menu-check" id="menu-restore">시작할 때 탭 복원</button>
          <button data-cmd="registerOpenWith">.md 파일 '연결 프로그램'에 등록</button>
        </div>
      </div>
    </div>
  </header>

  <nav id="tabbar">
    <div id="tabs" role="tablist"></div>
    <button class="tab-new" data-cmd="newTab" title="새 탭 (Ctrl+T)">
      <svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>
    </button>
  </nav>

  <div id="findbar" hidden>
    <input id="find-input" type="search" placeholder="문서에서 찾기" autocomplete="off" spellcheck="false">
    <span id="find-count"></span>
    <button class="tb-btn" data-cmd="findPrev" title="이전 (Shift+Enter)"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
    <button class="tb-btn" data-cmd="findNext" title="다음 (Enter)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="tb-btn" data-cmd="findClose" title="닫기 (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div id="layout">
    <aside id="sidebar">
      <div class="sb-tabs" role="tablist">
        <button class="sb-tab" data-pane="files" title="파일 (Ctrl+Shift+E)">
          <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        </button>
        <button class="sb-tab" data-pane="search" title="볼트 검색 (Ctrl+Shift+F)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="sb-tab" data-pane="toc" title="목차 (Ctrl+Shift+O)">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
        </button>
        <button class="sb-tab" data-pane="backlinks" title="백링크 (Ctrl+Shift+B)">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
          <span class="sb-badge" id="bl-badge" hidden></span>
        </button>
      </div>

      <section class="sb-pane" data-pane="files">
        <div class="pane-head">
          <input id="file-filter" type="search" placeholder="파일 이름으로 거르기" autocomplete="off" spellcheck="false">
        </div>
        <div class="pane-sub" id="files-root"></div>
        <div id="file-tree" class="pane-body"></div>
      </section>

      <section class="sb-pane" data-pane="search">
        <div class="pane-head">
          <input id="vault-search" type="search" placeholder="볼트 전체 검색" autocomplete="off" spellcheck="false">
        </div>
        <div class="pane-sub" id="search-status">여러 단어 · "구절" · #태그 · file:이름</div>
        <div id="search-results" class="pane-body"></div>
      </section>

      <section class="sb-pane" data-pane="toc">
        <div class="pane-title">목차</div>
        <ul id="toc-list" class="pane-body"></ul>
      </section>

      <section class="sb-pane" data-pane="backlinks">
        <div class="pane-title">백링크 <span id="bl-count"></span></div>
        <div id="backlinks" class="pane-body"></div>
      </section>
    </aside>
    <div id="sb-resizer" title="끌어서 너비 조절"></div>

    <main id="main">
      <div id="welcome">
        <div class="welcome-inner">
          <div class="welcome-mark">M↓</div>
          <h1>MdReader</h1>
          <p>마크다운 파일을 이 창에 끌어다 놓거나 <kbd>Ctrl</kbd>+<kbd>O</kbd>로 여세요.</p>
          <button class="welcome-open" data-cmd="open">파일 열기</button>
          <div id="recent-wrap" hidden>
            <h2>최근 파일</h2>
            <ul id="recent-list"></ul>
          </div>
        </div>
      </div>
      <article id="doc" class="markdown-body markdown-preview-view markdown-rendered" hidden></article>
    </main>
  </div>

  <div id="preview" class="hover-popover" hidden>
    <div class="hp-head"><a href="#" class="internal-link hp-title"></a><span class="hp-hint">클릭: 열기 · Ctrl+클릭: 새 탭</span></div>
    <div class="hp-body markdown-body markdown-preview-view"></div>
  </div>

  <div id="switcher" class="modal" hidden>
    <div class="sw-box" role="dialog" aria-label="빠른 이동">
      <input id="sw-input" type="text" placeholder="노트 이름으로 이동 (초성 검색 가능: ㅍㄹㅈㅌ)" autocomplete="off" spellcheck="false">
      <ul id="sw-list"></ul>
      <div class="sw-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 선택</span><span><kbd>Enter</kbd> 열기</span><span><kbd>Ctrl+Enter</kbd> 새 탭</span><span><kbd>Esc</kbd> 닫기</span></div>
    </div>
  </div>

  <div id="toast" hidden></div>
  <div id="drop-overlay" hidden><div>여기에 놓아서 열기</div></div>

  <script src="vendor/vendor.js"></script>
  <script src="js/obsidian.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
